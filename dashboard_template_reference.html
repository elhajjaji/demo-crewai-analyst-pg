<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{SOURCE_NAME}} — Analyse de données</title>
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #0f1117;
    --surface:  #1a1d27;
    --border:   #2a2d3a;
    --teal:     #00d4aa;
    --amber:    #f59e0b;
    --text:     #e2e8f0;
    --muted:    #64748b;
    --danger:   #ef4444;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 1.5rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--teal);
    letter-spacing: -0.02em;
  }
  .header-meta {
    font-size: 0.75rem;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
  }
  .header-badge {
    background: rgba(0,212,170,0.1);
    border: 1px solid rgba(0,212,170,0.3);
    color: var(--teal);
    padding: 0.25rem 0.75rem;
    border-radius: 9999px;
    font-size: 0.7rem;
    font-family: 'IBM Plex Mono', monospace;
  }

  /* ── TABS NAV ── */
  .tabs-nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    display: flex;
    gap: 0;
    overflow-x: auto;
    scrollbar-width: thin;
  }
  .tab-btn {
    padding: 1rem 1.5rem;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--muted);
    cursor: pointer;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.85rem;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active {
    color: var(--teal);
    border-bottom-color: var(--teal);
  }

  /* ── MAIN CONTENT ── */
  .main { padding: 2rem; max-width: 1400px; margin: 0 auto; }
  
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ── KPI CARDS ── */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 1rem;
    margin-bottom: 2rem;
  }
  .kpi-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.25rem 1.5rem;
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .kpi-card:hover { border-color: rgba(0,212,170,0.4); }
  .kpi-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--teal), transparent);
  }
  .kpi-label {
    font-size: 0.7rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 0.5rem;
    font-family: 'IBM Plex Mono', monospace;
  }
  .kpi-value {
    font-size: 1.75rem;
    font-weight: 600;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--text);
    line-height: 1;
  }
  .kpi-unit {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 0.25rem;
  }

  /* ── CHART + INSIGHTS ROW ── */
  .analysis-grid {
    display: grid;
    grid-template-columns: 1fr 360px;
    gap: 1.5rem;
    margin-bottom: 1.5rem;
  }
  @media (max-width: 1024px) {
    .analysis-grid { grid-template-columns: 1fr; }
  }

  .chart-container {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.5rem;
  }
  .chart-title {
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 1rem;
    font-family: 'IBM Plex Mono', monospace;
  }

  /* ── INSIGHTS ── */
  .insights-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  .insights-title {
    font-size: 0.7rem;
    color: var(--teal);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-family: 'IBM Plex Mono', monospace;
    margin-bottom: 0.5rem;
  }
  .insight-summary {
    font-size: 0.9rem;
    color: var(--text);
    line-height: 1.6;
    border-left: 2px solid var(--teal);
    padding-left: 1rem;
  }
  .findings-list { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }
  .finding-item {
    display: flex;
    gap: 0.75rem;
    align-items: flex-start;
    font-size: 0.82rem;
    color: var(--muted);
    line-height: 1.5;
  }
  .finding-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--amber);
    margin-top: 0.4rem;
    flex-shrink: 0;
  }

  /* ── DATA TABLE ── */
  .table-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
  }
  .table-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
  }
  .table-label {
    font-size: 0.7rem;
    color: var(--teal);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-family: 'IBM Plex Mono', monospace;
  }
  .search-input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.4rem 0.75rem;
    border-radius: 4px;
    font-size: 0.8rem;
    width: 220px;
    outline: none;
    font-family: 'IBM Plex Mono', monospace;
  }
  .search-input:focus { border-color: var(--teal); }
  .search-input::placeholder { color: var(--muted); }

  .data-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  .data-table th {
    text-align: left;
    padding: 0.6rem 1rem;
    color: var(--muted);
    font-weight: 500;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
  }
  .data-table th:hover { color: var(--teal); }
  .data-table td {
    padding: 0.6rem 1rem;
    border-bottom: 1px solid rgba(42,45,58,0.5);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
  }
  .data-table tr:hover td { background: rgba(0,212,170,0.03); }
  .pagination {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 0.5rem;
    margin-top: 1rem;
    font-size: 0.75rem;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
  }
  .page-btn {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.25rem 0.6rem;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.75rem;
  }
  .page-btn:hover { border-color: var(--teal); color: var(--teal); }
  .page-btn.active { background: var(--teal); color: var(--bg); border-color: var(--teal); }

  /* ── SQL ACCORDION ── */
  .sql-accordion {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 1.5rem;
    overflow: hidden;
  }
  .sql-toggle {
    width: 100%;
    background: none;
    border: none;
    padding: 0.75rem 1.25rem;
    color: var(--muted);
    cursor: pointer;
    text-align: left;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .sql-toggle:hover { color: var(--teal); }
  .sql-body { display: none; padding: 1rem 1.25rem; border-top: 1px solid var(--border); }
  .sql-body.open { display: block; }
  .sql-code {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    color: var(--teal);
    white-space: pre-wrap;
    line-height: 1.6;
  }

  /* ── FOOTER ── */
  .footer {
    text-align: center;
    padding: 2rem;
    color: var(--muted);
    font-size: 0.7rem;
    font-family: 'IBM Plex Mono', monospace;
    border-top: 1px solid var(--border);
    margin-top: 2rem;
  }

  /* ── PLOTLY THEME ── */
  .js-plotly-plot .plotly { background: transparent !important; }
</style>
</head>
<body>

<!-- ── HEADER ── -->
<header class="header">
  <div>
    <div class="header-title">⬡ {{SOURCE_NAME}}</div>
    <div class="header-meta">Généré le {{GENERATED_AT}} • {{AXES_COUNT}} axes d'analyse</div>
  </div>
  <div style="display:flex;gap:0.75rem;align-items:center;">
    <span class="header-badge">Ollama · CrewAI</span>
    <span class="header-badge">pg_analyst</span>
  </div>
</header>

<!-- ── TABS NAV ── -->
<nav class="tabs-nav" id="tabsNav">
  <!-- Généré dynamiquement par le script -->
</nav>

<!-- ── MAIN ── -->
<main class="main" id="mainContent">
  <!-- Généré dynamiquement par le script -->
</main>

<!-- ── FOOTER ── -->
<footer class="footer">
  Généré par pg_analyst &nbsp;·&nbsp; Ollama + CrewAI &nbsp;·&nbsp; {{GENERATED_AT}}
</footer>

<script>
// ══════════════════════════════════════════════════════════════
// DONNÉES — injectées par l'agent Dashboard
// ══════════════════════════════════════════════════════════════
const DASHBOARD_DATA = {{DASHBOARD_DATA_JSON}};

// ══════════════════════════════════════════════════════════════
// MOTEUR DU DASHBOARD
// ══════════════════════════════════════════════════════════════

// Palettes Plotly cohérentes
const PLOTLY_COLORS = [
  '#00d4aa','#f59e0b','#6366f1','#ec4899','#14b8a6',
  '#f97316','#8b5cf6','#06b6d4','#84cc16','#ef4444'
];
const PLOTLY_LAYOUT_BASE = {
  paper_bgcolor: 'transparent',
  plot_bgcolor:  'transparent',
  font: { family: 'IBM Plex Mono', color: '#e2e8f0', size: 11 },
  margin: { t: 30, b: 50, l: 50, r: 20 },
  xaxis: { gridcolor: '#2a2d3a', linecolor: '#2a2d3a', zerolinecolor: '#2a2d3a' },
  yaxis: { gridcolor: '#2a2d3a', linecolor: '#2a2d3a', zerolinecolor: '#2a2d3a' },
  legend: { bgcolor: 'transparent', bordercolor: '#2a2d3a' }
};

// ── Construire les onglets ─────────────────────────────────────
function buildTabs() {
  const nav     = document.getElementById('tabsNav');
  const content = document.getElementById('mainContent');

  DASHBOARD_DATA.axes.forEach((axis, idx) => {
    // Bouton nav
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (idx === 0 ? ' active' : '');
    btn.textContent = axis.axis_name;
    btn.onclick = () => activateTab(idx);
    nav.appendChild(btn);

    // Panel contenu
    const panel = document.createElement('div');
    panel.className = 'tab-panel' + (idx === 0 ? ' active' : '');
    panel.id = `panel-${idx}`;
    panel.innerHTML = buildPanelHTML(axis, idx);
    content.appendChild(panel);
  });
}

// ── Construire le HTML d'un panel ─────────────────────────────
function buildPanelHTML(axis, idx) {
  // KPI cards
  const kpiCards = (axis.kpis || []).map(kpi => `
    <div class="kpi-card">
      <div class="kpi-label">${kpi.label}</div>
      <div class="kpi-value">${kpi.value}</div>
      ${kpi.unit ? `<div class="kpi-unit">${kpi.unit}</div>` : ''}
    </div>
  `).join('');

  // Key findings
  const findings = (axis.key_findings || []).map(f => `
    <li class="finding-item">
      <span class="finding-dot"></span>
      <span>${f}</span>
    </li>
  `).join('');

  // SQL queries (une par query result)
  const sqlBlocks = (axis.queries_and_results || []).map((q, qi) => `
    <div class="sql-accordion">
      <button class="sql-toggle" onclick="toggleSQL(this)">
        <span>▶ ${q.question}</span>
        <span>SQL ↓</span>
      </button>
      <div class="sql-body">
        <pre class="sql-code">${q.sql || ''}</pre>
      </div>
    </div>
  `).join('');

  // Table (première query result avec des lignes)
  const firstResult = (axis.queries_and_results || []).find(q => q.rows && q.rows.length > 0);
  const tableHTML = firstResult ? buildTable(firstResult, `table-${idx}`) : '';

  return `
    <div class="kpi-grid">${kpiCards}</div>
    
    <div class="analysis-grid">
      <div class="chart-container">
        <div class="chart-title">${axis.axis_name}</div>
        <div id="chart-${idx}" style="height:380px;"></div>
      </div>
      <div class="insights-panel">
        <div class="insights-title">⬡ Insights IA</div>
        <p class="insight-summary">${axis.axis_description || ''}</p>
        <ul class="findings-list">${findings}</ul>
      </div>
    </div>

    ${tableHTML}
    ${sqlBlocks}
  `;
}

// ── Table filtrable avec pagination ───────────────────────────
function buildTable(result, tableId) {
  if (!result.columns || !result.rows) return '';
  const headers = result.columns.map(c =>
    `<th onclick="sortTable('${tableId}', '${c}')">${c}</th>`
  ).join('');

  return `
    <div class="table-section">
      <div class="table-header">
        <span class="table-label">⬡ Données</span>
        <input class="search-input" placeholder="Rechercher..." 
               oninput="filterTable('${tableId}', this.value)">
      </div>
      <div style="overflow-x:auto;">
        <table class="data-table" id="${tableId}">
          <thead><tr>${headers}</tr></thead>
          <tbody id="${tableId}-body"></tbody>
        </table>
      </div>
      <div class="pagination" id="${tableId}-pagination"></div>
    </div>
  `;
}

// ── Initialiser les données de table ──────────────────────────
const tableState = {};

function initTables() {
  DASHBOARD_DATA.axes.forEach((axis, idx) => {
    const firstResult = (axis.queries_and_results || []).find(q => q.rows && q.rows.length > 0);
    if (!firstResult) return;
    const tableId = `table-${idx}`;
    tableState[tableId] = {
      data:     firstResult.rows,
      filtered: firstResult.rows,
      page:     0,
      perPage:  15
    };
    renderTable(tableId, firstResult.columns);
  });
}

function renderTable(tableId, columns) {
  const state   = tableState[tableId];
  if (!state) return;
  const cols    = columns || [];
  const start   = state.page * state.perPage;
  const slice   = state.filtered.slice(start, start + state.perPage);
  const tbody   = document.getElementById(`${tableId}-body`);
  if (!tbody) return;

  tbody.innerHTML = slice.map(row => {
    const cells = (Array.isArray(row) ? row : cols.map(c => row[c]))
      .map(v => `<td>${v ?? ''}</td>`).join('');
    return `<tr>${cells}</tr>`;
  }).join('');

  renderPagination(tableId, cols);
}

function renderPagination(tableId, columns) {
  const state   = tableState[tableId];
  const total   = Math.ceil(state.filtered.length / state.perPage);
  const pag     = document.getElementById(`${tableId}-pagination`);
  if (!pag) return;

  let html = `<span>${state.filtered.length} lignes</span>`;
  for (let i = 0; i < total; i++) {
    html += `<button class="page-btn ${i === state.page ? 'active' : ''}" 
             onclick="gotoPage('${tableId}', ${i}, ${JSON.stringify(columns)})">${i+1}</button>`;
  }
  pag.innerHTML = html;
}

function gotoPage(tableId, page, columns) {
  tableState[tableId].page = page;
  renderTable(tableId, columns);
}

function filterTable(tableId, query) {
  const state = tableState[tableId];
  const q     = query.toLowerCase();
  state.filtered = q
    ? state.data.filter(row =>
        (Array.isArray(row) ? row : Object.values(row))
          .some(v => String(v).toLowerCase().includes(q))
      )
    : state.data;
  state.page = 0;
  const axis = DASHBOARD_DATA.axes.find((_, i) => `table-${i}` === tableId);
  const cols = axis?.queries_and_results?.find(q => q.rows?.length > 0)?.columns || [];
  renderTable(tableId, cols);
}

function sortTable(tableId, col) {
  const state = tableState[tableId];
  state.filtered = [...state.filtered].sort((a, b) => {
    const va = Array.isArray(a) ? a[0] : a[col];
    const vb = Array.isArray(b) ? b[0] : b[col];
    return String(va).localeCompare(String(vb), undefined, { numeric: true });
  });
  const axis = DASHBOARD_DATA.axes.find((_, i) => tableId === `table-${i}`);
  const cols = axis?.queries_and_results?.find(q => q.rows?.length > 0)?.columns || [];
  renderTable(tableId, cols);
}

// ── Graphiques Plotly ──────────────────────────────────────────
function buildCharts() {
  DASHBOARD_DATA.axes.forEach((axis, idx) => {
    const container = document.getElementById(`chart-${idx}`);
    if (!container) return;

    const result = (axis.queries_and_results || []).find(q => q.rows && q.rows.length > 0);
    if (!result) return;

    const chartType = axis.recommended_chart || 'bar';
    const cols      = result.columns || [];
    const rows      = result.rows   || [];

    // Extraire colonnes X et Y
    const xCol = cols[0];
    const yCol = cols[1] || cols[0];
    const xData = rows.map(r => Array.isArray(r) ? r[0] : r[xCol]);
    const yData = rows.map(r => Array.isArray(r) ? r[1] : r[yCol]);

    let traces = [];
    const layout = {
      ...PLOTLY_LAYOUT_BASE,
      colorway: PLOTLY_COLORS
    };

    switch(chartType) {
      case 'pie':
      case 'donut':
        traces = [{ type: 'pie', labels: xData, values: yData,
          hole: chartType === 'donut' ? 0.4 : 0,
          marker: { colors: PLOTLY_COLORS },
          textinfo: 'label+percent' }];
        break;
      case 'line':
        traces = [{ type: 'scatter', mode: 'lines+markers',
          x: xData, y: yData,
          line: { color: PLOTLY_COLORS[0], width: 2 },
          marker: { color: PLOTLY_COLORS[0] } }];
        layout.xaxis.title = xCol;
        layout.yaxis.title = yCol;
        break;
      case 'scatter':
        traces = [{ type: 'scatter', mode: 'markers',
          x: xData, y: yData,
          marker: { color: PLOTLY_COLORS[0], size: 8 } }];
        break;
      case 'heatmap':
        traces = [{ type: 'heatmap', z: rows,
          colorscale: [['0','#0f1117'],['1','#00d4aa']] }];
        break;
      default: // bar
        traces = [{ type: 'bar', x: xData, y: yData,
          marker: {
            color: PLOTLY_COLORS[0],
            opacity: 0.85
          } }];
        layout.xaxis.title = xCol;
        layout.yaxis.title = yCol;
    }

    Plotly.newPlot(`chart-${idx}`, traces, layout, {
      responsive: true,
      displayModeBar: true,
      modeBarButtonsToRemove: ['toImage', 'sendDataToCloud'],
      displaylogo: false
    });
  });
}

// ── Navigation onglets ─────────────────────────────────────────
function activateTab(idx) {
  document.querySelectorAll('.tab-btn').forEach((b,i) =>
    b.classList.toggle('active', i === idx));
  document.querySelectorAll('.tab-panel').forEach((p,i) =>
    p.classList.toggle('active', i === idx));
  // Re-render le graphique (nécessaire si panel était caché)
  setTimeout(() => {
    const axis = DASHBOARD_DATA.axes[idx];
    const result = (axis?.queries_and_results||[]).find(q=>q.rows?.length>0);
    if (result) buildChartForIndex(idx, axis, result);
  }, 50);
}

function buildChartForIndex(idx, axis, result) {
  // Réutilise la logique buildCharts pour un seul index
  buildCharts(); // simple : re-render tout (Plotly gère le diff)
}

// ── SQL accordion ──────────────────────────────────────────────
function toggleSQL(btn) {
  const body = btn.nextElementSibling;
  body.classList.toggle('open');
  const arrow = btn.querySelector('span:last-child');
  arrow.textContent = body.classList.contains('open') ? 'SQL ↑' : 'SQL ↓';
}

// ── Init ───────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  buildTabs();
  initTables();
  buildCharts();
});
</script>
</body>
</html>
