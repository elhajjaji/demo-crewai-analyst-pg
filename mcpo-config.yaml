# ============================================================
# Configuration mcpo — MCP-over-HTTP
# Lance avec : mcpo --config mcpo-config.yaml --port 8000
# ============================================================

servers:

  # ── Benefits Dataset (PostgreSQL port 5433) ──────────────
  # Utiliser cette config si mcpo tourne sur la machine HÔTE
  postgres-benefits:
    type: stdio
    command: uvx
    args:
      - mcp-server-postgres
      - postgresql://user:password@localhost:5433/pocs

  # ── Benefits Dataset (si mcpo tourne dans Docker) ────────
  # postgres-benefits:
  #   type: stdio
  #   command: uvx
  #   args:
  #     - mcp-server-postgres
  #     - postgresql://user:password@postgres:5432/pocs

