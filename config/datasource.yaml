# ============================================================
# SEUL FICHIER À MODIFIER POUR CHANGER DE SOURCE DE DONNÉES
# ============================================================

name: "Benefits Dataset - Hospice Général"

connection:
  # URL du serveur mcpo exposant PostgreSQL
  mcpo_url: "http://localhost:8000"
  # Nom du serveur déclaré dans mcpo-config.yaml
  mcpo_server: "postgres-benefits"
  schema: "src"

ollama:
  model: "qwen2.5:14b"
  base_url: "http://localhost:11434"   # ← laisser sans /v1, CrewAI LLM le gère

# ── Configuration des LLM ────────────────────────────────────────────────────
# Déclarez ici tous vos LLM disponibles (locaux et commerciaux).
# Chaque LLM a un identifiant unique (id) utilisé pour l'assigner aux agents.
llms:
  default: "ollama_qwen14b"          # LLM utilisé si l'agent n'en spécifie pas

  models:
    - id: "ollama_qwen14b"
      provider: "ollama"
      model: "qwen2.5:14b"
      base_url: "http://localhost:11434"

    - id: "ollama_qwen_coder14b"
      provider: "ollama"
      model: "qwen2.5-coder:14b"
      base_url: "http://localhost:11434"

    - id: "ollama_mistral"
      provider: "ollama"
      model: "mistral:7b"
      base_url: "http://localhost:11434"

    - id: "ollama_codellama13b"
      provider: "ollama"
      model: "codellama:13b"
      base_url: "http://localhost:11434"

    - id: "ollama_deepseek_coder16b"
      provider: "ollama"
      model: "deepseek-coder-v2:16b"
      base_url: "http://localhost:11434"

    - id: "ollama_qwen3_14b"
      provider: "ollama"
      model: "qwen3:14b"
      base_url: "http://localhost:11434"

    # Exemple LLM commercial (décommenter et renseigner api_key)
    # - id: "openai_gpt4o"
    #   provider: "openai"
    #   model: "gpt-4o"
    #   base_url: "https://api.openai.com/v1"
    #   api_key: "sk-..."

# ── Attribution des LLM par agent ────────────────────────────────────────────
# Valeurs possibles : un id de llms.models, ou null (→ utilise llms.default)
  agents:
    orchestrator: "ollama_qwen14b"       # raisonnement complexe, délégation
    analyst: "ollama_qwen14b"            # interprétation métier, itération analytique
    sql_requester: "ollama_qwen3_14b"   # bon suivi d'instructions, support tools
    dashboard_generator: "ollama_deepseek_coder16b"   # génération HTML/JS

analysis:
  user_guidelines: |
    Je veux comprendre cette base de gestion des bénéficiaires sociaux :

    AXE 1 — Démographie des bénéficiaires
    - Répartition par sexe, tranche d'âge, statut (vivant/décédé)
    - Âge moyen et distribution des âges à l'entrée dans le système
    - Évolution du nombre de bénéficiaires actifs par année

    AXE 2 — Analyse des dossiers
    - Durée moyenne des dossiers, taux de dossiers ouverts
    - Nombre de dossiers par individu, récurrence

    AXE 3 — Prestations : dispersion et profils
    - Fréquence et montant par type de prestation
    - Dispersion par sexe, type de permis, année
    - Prestations uniques vs récurrentes par individu

    AXE 4 — Évolution temporelle
    - Évolution du nombre de bénéficiaires par année
    - Évolution des montants par type de permis et par année
    - Saisonnalité mensuelle des prestations
    - Délai dossier → première prestation

    AXE 5 — Permis et statut administratif
    - Types de permis les plus fréquents
    - Corrélation type de permis × montant de prestation
    - Permis expirés avec prestations encore actives

    AXE 6 — Segmentation des bénéficiaires
    - Top 10% des bénéficiaires par montant total reçu : quel profil ?
    - Segmentation par intensité d'utilisation

    AXE 7 — Qualité des données et anomalies
    - Individus décédés avec prestations postérieures
    - Montants aberrants, dossiers incohérents, doublons NAVS

  # Nombre de tours d'enrichissement (l'analyste demande des requêtes supplémentaires)
  max_enrichment_turns: 3

output:
  dir: "output/"
